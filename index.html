<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parametric Curves</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <div id="ui-top">
<h1>Parametric Curves<br /><span>Three.js demo by Kengo Kuriaki</span></h1>
          <p id="desc">
            Interactive Three.js visualizaiton comparing Bézier curve and Catmull-Rom Curve
          </p>
        </div>
        <div id="ui-bottom">
          <div id="legend">
            <span class="swatch"><i style="background: #4fc3f7"></i>Bézier</span>
            <span class="swatch"><i style="background: #ffb74d"></i>Catmull-Rom</span>
            <span class="swatch"><i class="dot" style="background: #90a4ae"></i>Control point</span>
          </div>
          <p id="hint">Left drag: move point / Right drag: rotate view / Scroll: zoom</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
